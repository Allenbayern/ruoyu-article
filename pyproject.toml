[project]
name = "ruoyu-film-daily"
version = "0.1.0"
description = "Offline controlled-production gates for the Ruoyu film article group"
requires-python = ">=3.14"
dependencies = [
    "trafilatura==2.1.0",
    # 运行时依赖，不是 dev：article_group/__init__ 经 editorial_pipeline_v3 在导入期就要它，
    # 没有它连 `import article_group` 都会失败（tests/test_runtime_dependencies.py 守住这条）。
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
