[project]
name = "ruoyu-film-daily"
version = "0.1.0"
description = "Offline controlled-production gates for the Ruoyu film article group"
requires-python = ">=3.14"
dependencies = [
    "trafilatura==2.1.0",
    # 运行时依赖，不是 dev：article_group/__init__ 经 editorial_pipeline_v3 在导入期就要它，
    # 没有它连 `import article_group` 都会失败（tests/test_runtime_dependencies.py 守住这条）。
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# 可选：对比卡 HTML→PNG 渲染（article_group/comparison_card.py 惰性导入，缺失时跳过渲染）。
# 安装：uv sync --extra render && uv run playwright install chromium
render = [
    "playwright>=1.48",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
